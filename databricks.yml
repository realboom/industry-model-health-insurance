bundle:
  name: industry-model-health-insurance

include:
  - resources/*.yml

variables:
  silver_catalog:
    description: >-
      Catalog holding the Databricks Industry Data Model (health_insurance ECM),
      installed with cataloging style "One Catalog" (one schema per domain:
      member, claim, plan, provider, utilization, ...).
    default: health_insurance
  gold_catalog:
    description: Catalog the gold (Kimball dimensional) layer is published into. Must already exist.
    default: health_insurance_gold
  gold_schema:
    description: Schema inside gold_catalog for dims, facts, aggregates and metric views. Created by this bundle.
    default: core
  silver_history_schema:
    description: Schema inside silver_catalog for the SCD Type 2 history tables. Created by this bundle.
    default: history
  scd2_source_tables:
    description: >-
      Comma-separated <domain>.<table> list of silver tables the history pipeline reads.
      Change Data Feed is enabled on each by the hi-silver-history job. Keep in sync
      with src/silver_history/*.sql.
    default: member.identity,member.subscriber,provider.provider,provider.group_practice,provider.facility,plan.health_plan,plan.benefit_package,employer.group,network.provider_network
  date_dim_start:
    description: First date in dim_date (YYYY-MM-DD).
    default: "2015-01-01"
  date_dim_end:
    description: Last date in dim_date (YYYY-MM-DD).
    default: "2035-12-31"

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://<your-dev-workspace>.azuredatabricks.net

  prod:
    mode: production
    # workspace:
    #   host: https://<your-prod-workspace>.azuredatabricks.net
    #   root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
